services:
  - type: web
    name: hotel-connect-cloud
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/incidents
    envVars:
      - key: TELEGRAM_HOTEL_BOT_TOKEN
        sync: false
      - key: TELEGRAM_HOTEL_CHAT_ID
        sync: false
      # When frontend is a separate static site, set at build time to the backend URL (no trailing slash).
      - key: VITE_API_BASE_URL
        sync: false
      # Optional: restrict CORS to your frontend origin (e.g. https://your-frontend.onrender.com).
      - key: CORS_ALLOW_ORIGIN
        sync: false
